name: CI – PS3 (PSL1GHT)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# ps3dev/buildenv does not exist as a public Docker Hub image.
# We instead use a bare ubuntu-24.04 runner and build the ps3toolchain
# from source using the official ps3dev/ps3toolchain scripts, caching the
# result so subsequent runs are fast.
jobs:
  build:
    name: Build PS3 (PSL1GHT)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make cmake git curl wget \
            bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev \
            libncurses-dev python3 zlib1g-dev patch libssl-dev \
            autoconf automake libtool pkg-config

      - name: Cache PS3 toolchain
        id: cache-ps3
        uses: actions/cache@v4
        with:
          path: /usr/local/ps3dev
          key: ps3toolchain-v3-${{ runner.os }}

      - name: Build PS3 toolchain from source
        if: steps.cache-ps3.outputs.cache-hit != 'true'
        timeout-minutes: 90
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          sudo mkdir -p $PS3DEV && sudo chown -R $USER:$USER $PS3DEV

          git clone --depth=1 https://github.com/ps3dev/ps3toolchain.git /tmp/ps3toolchain
          cd /tmp/ps3toolchain
          # Build toolchain (PPU compiler + PSL1GHT)
          bash toolchain.sh 2>&1 | tail -80
          echo "✅ PS3 toolchain built"

      - name: Add toolchain to PATH
        run: |
          echo "/usr/local/ps3dev/bin" >> $GITHUB_PATH
          echo "/usr/local/ps3dev/ppu/bin" >> $GITHUB_PATH
          echo "/usr/local/ps3dev/spu/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          ppu-gcc --version && echo "✅ ppu-gcc found" || (echo "❌ ppu-gcc not found"; exit 1)
          echo "PS3DEV=/usr/local/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=/usr/local/ps3dev" >> $GITHUB_ENV

      - name: Build Blockamok for PS3
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV
          make -f Makefiles/Makefile_ps3 -j$(nproc)

      - name: Verify output
        run: ls -lh *.self *.elf 2>/dev/null || (echo "❌ No build output found"; exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: blockamokremix-ps3
          path: |
            *.self
            *.elf
          retention-days: 14
          if-no-files-found: warn
