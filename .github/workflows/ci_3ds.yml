name: CI – Nintendo 3DS

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build:
    name: Build 3DS (devkitPro)
    runs-on: ubuntu-24.04
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Sync dkp-pacman databases with retry
        run: |
          dkp-pacman -Sy --noconfirm 2>/dev/null || \
          (sleep 15 && dkp-pacman -Sy --noconfirm 2>/dev/null) || \
          (sleep 30 && dkp-pacman -Sy --noconfirm)

      - name: Install 3DS dev tools and SDL2 portlibs
        run: |
          dkp-pacman -S --noconfirm --needed \
            3ds-dev \
            3ds-sdl2 \
            3ds-sdl2_mixer \
            3ds-sdl2_ttf \
            3ds-libogg \
            3ds-libvorbis \
            3ds-mikmod

      - name: Symlink Makefile for devkitPro recursive build
        # Makefile_3ds calls: $(MAKE) -C $(BUILD) -f $(CURDIR)/Makefile
        # $(CURDIR) is the project root, so it expects a file called exactly "Makefile".
        run: ln -sf Makefiles/Makefile_3ds Makefile

      - name: Build
        run: |
          # devkitPro SDL2 portlibs install headers to portlibs/3ds/include/SDL2/.
          # Our source uses bare <SDL.h> (no SDL2/ prefix), so we add both paths.
          export PKG_CONFIG_PATH="$DEVKITPRO/portlibs/3ds/lib/pkgconfig:$DEVKITPRO/portlibs/armv6k/lib/pkgconfig"
          export CFLAGS="${CFLAGS} -I${DEVKITPRO}/portlibs/3ds/include/SDL2 -I${DEVKITPRO}/portlibs/3ds/include"
          make -j$(nproc)

      - name: Verify output
        run: ls -lh *.cia *.3dsx *.smdh 2>/dev/null || ls -lh *.elf 2>/dev/null || (echo "❌ No build output found"; exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: blockamokremix-3ds
          path: |
            *.cia
            *.3dsx
            *.smdh
          retention-days: 14
          if-no-files-found: warn
