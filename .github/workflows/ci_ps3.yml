name: CI – PS3 (PSL1GHT)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# Uses the official ps3dev/ps3dev Docker Hub image which ships a complete
# PS3 toolchain (ppu-gcc, spu-gcc, PSL1GHT, ps3libraries).
# The image that was previously referenced (ps3dev/buildenv) does not exist.
jobs:
  build:
    name: Build PS3 (PSL1GHT)
    runs-on: ubuntu-24.04
    container:
      image: ps3dev/ps3dev:latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          ppu-gcc --version && echo "ppu-gcc found" || (echo "ppu-gcc not found"; exit 1)
          echo "PS3DEV=$PS3DEV"
          echo "PSL1GHT=$PSL1GHT"

      - name: Build Blockamok for PS3
        run: |
          export PS3DEV="${PS3DEV:-/usr/local/ps3dev}"
          export PSL1GHT="${PSL1GHT:-$PS3DEV}"
          make -f Makefiles/Makefile_ps3 -j$(nproc)

      - name: Verify output
        run: ls -lh *.self *.elf 2>/dev/null || (echo "No build output found"; exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: blockamokremix-ps3
          path: |
            *.self
            *.elf
          retention-days: 14
          if-no-files-found: warn
