name: CI – Xbox 360 (libxenon)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build:
    name: Build Xbox 360 (libxenon)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make cmake git curl wget \
            bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev \
            libncurses-dev python3 zlib1g-dev

      - name: Cache libxenon toolchain
        id: cache-xenon
        uses: actions/cache@v4
        with:
          path: /usr/local/xenon
          key: libxenon-toolchain-v7-${{ runner.os }}

      - name: Build libxenon toolchain from source
        if: steps.cache-xenon.outputs.cache-hit != 'true'
        timeout-minutes: 90
        run: |
          PREFIX=/usr/local/xenon
          sudo mkdir -p $PREFIX && sudo chown -R $USER:$USER $PREFIX
          export PATH=$PATH:$PREFIX/bin

          # Clone libxenon (contains both the toolchain build scripts and the SDK)
          git clone --depth=1 https://github.com/Free60Project/libxenon.git /tmp/libxenon
          cd /tmp/libxenon

          # The libxenon Makefile targets:
          #   toolchain  – builds binutils + gcc cross-compiler
          #   libxenon   – builds the xenon SDK libraries
          # We need both so the final link against -lxenon succeeds.
          make toolchain CROSS_INSTALL_PREFIX=$PREFIX 2>&1 | tail -100
          make libxenon  CROSS_INSTALL_PREFIX=$PREFIX 2>&1 | tail -50

          ls $PREFIX/bin/powerpc64-xenon-elf-gcc \
            && echo "✅ xenon gcc built" \
            || (echo "❌ xenon gcc not found after build"; exit 1)

      - name: Add toolchain to PATH
        run: echo "/usr/local/xenon/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          powerpc64-xenon-elf-gcc --version \
            && echo "✅ toolchain verified" \
            || (echo "❌ powerpc64-xenon-elf-gcc not available"; exit 1)

      - name: Build Blockamok for Xbox 360
        run: make -f Makefiles/Makefile_xbox360 XENON_DIR=/usr/local/xenon -j$(nproc)

      - name: Verify output
        run: ls -lh *.xex 2>/dev/null || (echo "❌ No .xex output found"; exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: blockamokremix-xbox360
          path: '*.xex'
          retention-days: 14
          if-no-files-found: warn
