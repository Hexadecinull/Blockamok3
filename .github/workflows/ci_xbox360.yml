name: CI – Xbox 360 (libxenon)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build:
    name: Build Xbox 360 (libxenon)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make cmake git curl wget \
            bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev \
            libncurses-dev python3 zlib1g-dev

      - name: Cache xenon cross-compiler + libxenon SDK
        id: cache-xenon
        uses: actions/cache@v4
        with:
          path: /usr/local/xenon
          key: xenon-toolchain-binutils241-gcc1230-sdk-v5-${{ runner.os }}

      - name: Build xenon cross-compiler and libxenon SDK
        # libxenon provides only the SDK headers/libs – it does NOT build the
        # cross-compiler.  The compiler (powerpc64-xenon-elf-gcc) must be built
        # from binutils + gcc sources, then libxenon is built with that compiler.
        #
        # Steps:
        #   1. binutils-2.41  → powerpc64-xenon-elf-{as,ld,...}
        #   2. gcc-12.3.0 (C only, --without-headers)  → powerpc64-xenon-elf-gcc
        #   3. libxenon make install  → headers, libs, app.lds at $PREFIX
        if: steps.cache-xenon.outputs.cache-hit != 'true'
        timeout-minutes: 90
        run: |
          set -euo pipefail
          PREFIX=/usr/local/xenon
          sudo mkdir -p "$PREFIX" && sudo chown -R "$USER":"$USER" "$PREFIX"
          export PATH="$PREFIX/bin:$PATH"
          export DEVKITXENON="$PREFIX"

          BINUTILS_VER=2.41
          GCC_VER=12.3.0
          JOBS=$(nproc)
          WORK=/tmp/xenon-build
          mkdir -p "$WORK" && cd "$WORK"

          # ── 1. binutils ──────────────────────────────────────────────────
          echo "=== Downloading binutils $BINUTILS_VER ==="
          curl -sL "https://ftp.gnu.org/gnu/binutils/binutils-${BINUTILS_VER}.tar.xz" \
            | tar -xJ
          mkdir build-binutils && cd build-binutils
          ../binutils-${BINUTILS_VER}/configure \
            --target=powerpc64-xenon-elf \
            --prefix="$PREFIX" \
            --disable-nls \
            --disable-werror \
            --enable-lto \
            2>&1 | tail -5
          make -j"$JOBS" 2>&1 | tail -10
          make install 2>&1 | tail -5
          echo "binutils installed"
          cd "$WORK"

          # ── 2. gcc (bootstrap – C only, no libc yet) ─────────────────────
          echo "=== Downloading gcc $GCC_VER ==="
          curl -sL "https://ftp.gnu.org/gnu/gcc/gcc-${GCC_VER}/gcc-${GCC_VER}.tar.xz" \
            | tar -xJ
          cd gcc-${GCC_VER}
          ./contrib/download_prerequisites 2>&1 | tail -10
          cd "$WORK"
          mkdir build-gcc && cd build-gcc
          ../gcc-${GCC_VER}/configure \
            --target=powerpc64-xenon-elf \
            --prefix="$PREFIX" \
            --enable-languages=c \
            --without-headers \
            --disable-nls \
            --disable-multilib \
            --disable-threads \
            --disable-shared \
            --disable-decimal-float \
            --disable-libssp \
            --disable-libgomp \
            --disable-libquadmath \
            --with-cpu=cell \
            2>&1 | tail -5
          make -j"$JOBS" all-gcc 2>&1 | tail -10
          make install-gcc 2>&1 | tail -5
          echo "gcc (bootstrap) installed"
          cd "$WORK"

          # ── 3. libxenon SDK (headers + libs + app.lds) ───────────────────
          echo "=== Cloning libxenon ==="
          git clone --depth=1 https://github.com/Free60Project/libxenon.git libxenon-sdk
          cd libxenon-sdk
          # 'make install' builds the xenon SDK libraries and installs them.
          # DEVKITXENON is the install prefix expected by libxenon's Makefile.
          make install DEVKITXENON="$PREFIX" 2>&1 | tail -20
          echo "libxenon SDK installed"

          ls "$PREFIX/bin/powerpc64-xenon-elf-gcc" \
            && echo "xenon toolchain ready" \
            || (echo "xenon gcc not found after build"; exit 1)

      - name: Add toolchain to PATH
        run: echo "/usr/local/xenon/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          powerpc64-xenon-elf-gcc --version \
            && echo "toolchain verified" \
            || (echo "powerpc64-xenon-elf-gcc not available"; exit 1)

      - name: Build Blockamok for Xbox 360
        run: make -f Makefiles/Makefile_xbox360 XENON_DIR=/usr/local/xenon -j$(nproc)

      - name: Verify output
        run: ls -lh *.xex 2>/dev/null || (echo "No .xex output found"; exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: blockamokremix-xbox360
          path: '*.xex'
          retention-days: 14
          if-no-files-found: warn
