name: CI – Android

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (minSdk 19 / targetSdk 36)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and platform
        run: |
          echo "y" | sdkmanager --install \
            "ndk;26.3.11579264" \
            "build-tools;34.0.0" \
            "platforms;android-36"

      - name: Scaffold Android project files
        # All file generation lives in scripts/setup_android_project.sh.
        # This avoids embedding heredocs in YAML (column-0 content breaks
        # the block-scalar parser used by GitHub Actions).
        run: bash scripts/setup_android_project.sh

      - name: Set up Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew

      - name: Cache SDL2 Android sources
        id: cache-sdl2-android
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jni
          key: sdl2-android-2.30.10-mixer-2.8.0-v10

      - name: Download SDL2 Android sources
        if: steps.cache-sdl2-android.outputs.cache-hit != 'true'
        run: |
          JNI="android/app/src/main/jni"
          mkdir -p "$JNI/SDL2" "$JNI/SDL2_ttf"

          # SDL2 – release tarball (no submodules needed)
          curl -sL "https://github.com/libsdl-org/SDL/releases/download/release-2.30.10/SDL2-2.30.10.tar.gz" \
            | tar -xz -C "$JNI/SDL2" --strip-components=1

          # SDL2_mixer – MUST be git-cloned with --recurse-submodules.
          # The GitHub release tarball leaves external/wavpack/ empty, so the
          # NDK build fails with "No such file or directory: external/wavpack/Android.mk".
          echo "Cloning SDL2_mixer with submodules..."
          git clone --depth=1 --branch release-2.8.0 \
            https://github.com/libsdl-org/SDL_mixer.git "$JNI/SDL2_mixer"
          git -C "$JNI/SDL2_mixer" submodule update --init --depth=1

          # SDL2_ttf – release tarball
          curl -sL "https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.22.0/SDL2_ttf-2.22.0.tar.gz" \
            | tar -xz -C "$JNI/SDL2_ttf" --strip-components=1

      - name: Ensure wavpack Android.mk exists
        # SDL2_mixer's Android.mk unconditionally includes external/wavpack/Android.mk.
        # WavPack upstream does not ship one – generate it here in pure bash.
        run: |
          WP_DIR="android/app/src/main/jni/SDL2_mixer/external/wavpack"
          MK="$WP_DIR/Android.mk"

          if [ -f "$MK" ]; then
            echo "wavpack/Android.mk already present"
            exit 0
          fi

          echo "wavpack/Android.mk missing – generating..."

          if [ ! -d "$WP_DIR/src" ]; then
            echo "WavPack source not found – cloning..."
            rm -rf "$WP_DIR"
            git clone --depth=1 --branch 5.4.0 \
              https://github.com/dbry/WavPack.git "$WP_DIR"
          fi

          SKIP="wavpack.c wvunpack.c wvgain.c wvselfcheck.c wvtest.c"
          SRC_LIST=""
          for f in $(ls "$WP_DIR/src/"*.c 2>/dev/null | sort); do
            fname=$(basename "$f")
            is_skip=0
            for s in $SKIP; do
              [ "$fname" = "$s" ] && is_skip=1 && break
            done
            [ $is_skip -eq 0 ] && SRC_LIST="$SRC_LIST src/$fname"
          done

          [ -z "$SRC_LIST" ] && echo "ERROR: no .c files in $WP_DIR/src" && exit 1

          files_arr=($SRC_LIST)
          total=${#files_arr[@]}

          {
            echo 'LOCAL_PATH := $(call my-dir)'
            echo 'include $(CLEAR_VARS)'
            echo 'LOCAL_MODULE := wavpack'
            echo 'LOCAL_EXPORT_C_INCLUDES := $(LOCAL_PATH)/include'
            echo 'LOCAL_C_INCLUDES := $(LOCAL_PATH)/include $(LOCAL_PATH)/src'
            echo 'LOCAL_CFLAGS := -DNO_MAIN -DHAVE_FCNTL_H'
            echo -n 'LOCAL_SRC_FILES :='
            for i in "${!files_arr[@]}"; do
              printf ' \\\n    %s' "${files_arr[$i]}"
            done
            printf '\n'
            echo 'include $(BUILD_STATIC_LIBRARY)'
          } > "$MK"

          echo "Generated wavpack Android.mk with $total source files"

      - name: Copy game source into jni tree
        run: |
          cp src/*.c   android/app/src/main/c/       2>/dev/null || true
          cp src/*.h   android/app/src/main/c/       2>/dev/null || true
          cp src/audio/*.c android/app/src/main/c/audio/ 2>/dev/null || true
          cp src/audio/*.h android/app/src/main/c/audio/ 2>/dev/null || true
          cp src/fonts/*.c android/app/src/main/c/fonts/ 2>/dev/null || true
          cp src/fonts/*.h android/app/src/main/c/fonts/ 2>/dev/null || true

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: find android -name "*.apk" | xargs ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: blockamokremix-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  lint:
    name: Lint Android Manifest & Gradle
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Scaffold Android project for lint
        run: bash scripts/setup_android_project.sh

      - name: Check AndroidManifest.xml exists
        run: test -f android/app/src/main/AndroidManifest.xml && echo "ok" || (echo "AndroidManifest.xml missing"; exit 1)

      - name: Check screenOrientation is landscape
        run: grep -q 'screenOrientation="landscape"' android/app/src/main/AndroidManifest.xml && echo "ok" || (echo "screenOrientation not landscape"; exit 1)

      - name: Check targetSdk is 36
        run: grep -q 'targetSdk 36' android/app/build.gradle && echo "ok" || (echo "targetSdk check failed"; exit 1)

      - name: Check minSdk is 19
        run: grep -q 'minSdk 19' android/app/build.gradle && echo "ok" || (echo "minSdk check failed"; exit 1)

      - name: Check compileSdk is 36
        run: grep -q 'compileSdk 36' android/app/build.gradle && echo "ok" || (echo "compileSdk check failed"; exit 1)
